apiVersion: v1
kind: Namespace
metadata:
  name: breakfix-02
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: breakfix-02
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      nodeSelector:
        breakfix-target: "yes"
      containers:
      - name: worker
        image: busybox:1.36
        command: ["sh", "-c", "sleep 3600"]
